eval:
  model_name: "Qwen/Qwen2.5-7B"

  vllm:
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.95
    swap_space: 4
    dtype: "bfloat16"
    enforce_eager: false
    max_num_seqs: 256
    max_model_len: 16384
    enable_prefix_caching: true
    distributed_executor_backend: "mp"
    seed: 42

  sampling:
    temperature: 0.7
    top_p: 0.95
    top_k: 50
    min_p: 0.0
    max_tokens: 16384
    repetition_penalty: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0

  wandb:
    project: "mathsmall-eval"
    entity: null            # null = use default entity from wandb login
    enabled: true           # set false to skip W&B logging

  data_dir: "eval/data"
  output_dir: "eval/outputs"
