train:
  model_name: "Qwen/Qwen2.5-7B"
  dataset: "data/train.parquet"  # MATH lv.3-5 (~8K problems)
  output_dir: "outputs/qwen2.5-7b-grpo"
  s3_checkpoint_path: null  # e.g., "s3://bucket/checkpoints/" (optional)

  grpo:
    num_generations: 8              # rollouts per prompt
    max_completion_length: 8192     # max rollout length
    temperature: 1.0

    # DAPO loss (length-rectified, token-level)
    loss_type: "dapo"

    # KL as loss term (1e-4 for models ≤14B)
    beta: 0.0001

    # DAPO asymmetric clipping (prevents entropy collapse)
    epsilon: 0.2                    # lower clip bound
    epsilon_high: 0.28              # upper clip bound

    # Overlong filtering (stabilizes training)
    mask_truncated_completions: true

    # Entropy-based token filtering (optional)
    top_entropy_quantile: 0.2       # backprop through top 20% highest-entropy tokens

  training:
    per_device_train_batch_size: 2    # 2 prompts per GPU (× 8 generations each)
    gradient_accumulation_steps: 16   # 2 × 4 GPUs × 16 = 128 prompts × 8 gens = 1024 total
    max_steps: 200
    learning_rate: 1e-6
    warmup_ratio: 0.1
    bf16: true
    gradient_checkpointing: true
    save_strategy: "steps"
    save_steps: 10                    # save every 10 steps (~6 checkpoints per epoch)
    save_total_limit: 3               # keep only last 3 checkpoints

  vllm:
    use_vllm: true
    gpu_memory_utilization: 0.9

  logging:
    logging_steps: 1
    report_to: "wandb"

  wandb:
    project: "mathsmall-train"
    entity: null

eval:
  model_name: "Qwen/Qwen2.5-7B"

  vllm:
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.95
    swap_space: 4
    dtype: "bfloat16"
    enforce_eager: false
    max_num_seqs: 256
    max_model_len: 16384
    enable_prefix_caching: true
    distributed_executor_backend: "mp"
    seed: 42

  sampling:
    temperature: 0.7
    top_p: 0.95
    top_k: 50
    min_p: 0.0
    max_tokens: 16384
    repetition_penalty: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0

  wandb:
    project: "mathsmall-eval"
    entity: null            # null = use default entity from wandb login
    enabled: true           # set false to skip W&B logging

  data_dir: "eval/data"
  output_dir: "eval/outputs"
